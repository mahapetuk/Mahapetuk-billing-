<!DOCTYPE html>
<html lang="bn">
<link rel="manifest" href="manifest.json">
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>মহা পেটুক | Maha Petuk POS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #f59e0b;
      --bg-dark: #121212;
      --card-bg: #1c1c1e;
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Hind Siliguri', sans-serif; background-color: var(--bg-dark); color: var(--text-main); line-height: 1.5; padding-bottom: 110px; }
    
    .top-nav { display: flex; justify-content: space-between; align-items: center; background: #000; padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top: 0; z-index: 999; }
    .store-brand { font-size: 16px; font-weight: 800; color: var(--primary); }
    .nav-actions { display: inline-flex; gap: 8px; }
    .top-btn { background: #27272a; border: 1px solid #3f3f46; color: #fff; padding: 6px 12px; font-size: 13px; font-weight: bold; border-radius: 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .top-btn:active { background: var(--primary); color: #000; }
    .top-btn.btn-custom { background: rgba(245, 158, 11, 0.2); border-color: var(--primary); color: #fbbf24; }
    .top-btn.btn-history { background: rgba(59, 130, 246, 0.2); border-color: #3b82f6; color: #60a5fa; }

    .top-banner-container { width: 100%; max-width: 900px; margin: 0 auto; padding: 12px 12px 0; }
    .top-banner-img { width: 100%; height: auto; min-height: 160px; max-height: 320px; object-fit: cover; border-radius: 14px; display: block; border: 1px solid rgba(245, 158, 11, 0.3); }
    
    .hero { background: radial-gradient(circle at top, #2d1810 0%, #121212 75%); padding: 18px 20px 14px; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    .hero-title { font-size: 32px; font-weight: 800; color: #fff; margin-bottom: 2px; }
    .hero-sub { font-size: 15px; color: var(--primary); font-weight: 700; margin-bottom: 10px; }
    
    .today-summary-bar { display: inline-flex; align-items: center; gap: 8px; background: rgba(34, 197, 94, 0.15); border: 1px solid #22c55e; padding: 8px 18px; border-radius: 25px; font-size: 14px; color: #4ade80; font-weight: 700; }

    .controls-wrap { max-width: 900px; margin: 15px auto 0; padding: 0 15px; }
    .search-box-wrap { position: relative; margin-bottom: 12px; }
    .search-input { width: 100%; padding: 12px 14px 12px 42px; background: #1c1c1e; border: 1px solid rgba(255,255,255,0.15); border-radius: 12px; color: #fff; font-size: 15px; outline: none; }
    .search-input:focus { border-color: var(--primary); }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #71717a; font-size: 16px; }
    
    .category-pills-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
    .category-pills-bar::-webkit-scrollbar { display: none; }
    .cat-pill { white-space: nowrap; padding: 7px 16px; border-radius: 20px; background: #27272a; border: 1px solid rgba(255,255,255,0.08); color: #d4d4d8; font-size: 13px; font-weight: 600; cursor: pointer; }
    .cat-pill.active { background: var(--primary); color: #000; font-weight: 700; border-color: var(--primary); }

    .container { max-width: 900px; margin: 0 auto; padding: 10px 15px 20px; }
    .food-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 10px; }
    .food-card { background: var(--card-bg); border-radius: 14px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.06); display: flex; flex-direction: column; position: relative; }
    .food-img-wrap { position: relative; width: 100%; height: 165px; background: #232326; overflow: hidden; }
    .food-img { width: 100%; height: 100%; object-fit: cover; }
    
    .food-info { padding: 14px; display: flex; flex-direction: column; flex-grow: 1; justify-content: space-between; }
    .name-bn { font-size: 17px; font-weight: 700; color: #ffffff; margin-bottom: 6px; }
    .food-price-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .food-price { font-size: 16px; font-weight: 800; color: var(--primary); }
    
    .size-select-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .size-btn { flex: 1; padding: 7px 4px; background: #2a2a2e; border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; text-align: center; }
    .size-btn.active { background: var(--primary); color: #000; }

    .food-bottom { border-top: 1px dashed rgba(255, 255, 255, 0.1); padding-top: 10px; display: flex; gap: 8px; }
    .btn-add-item { flex: 1; background: #3b82f6; color: #ffffff; border: none; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
    .btn-add-item:active { transform: scale(0.96); }

    /* ভাসমান কার্ট বার */
    .cart-float-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #18181b; border-top: 2px solid var(--primary); padding: 12px 18px; display: none; justify-content: space-between; align-items: center; z-index: 1000; box-shadow: 0 -5px 20px rgba(0,0,0,0.8); }
    .cart-float-count { font-size: 13px; color: #e4e4e7; font-weight: 600; }
    .cart-float-total { font-size: 18px; font-weight: 800; color: var(--primary); }
    .cart-float-btn { background: #087f5b; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; cursor: pointer; }

    /* মোডাল */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 15px; }
    .receipt-box { background: #ffffff; color: #111111; width: 100%; max-width: 440px; border-radius: 14px; padding: 18px; font-family: system-ui, -apple-system, sans-serif; max-height: 92vh; overflow-y: auto; }
    .receipt-top-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #444; padding-bottom: 10px; margin-bottom: 10px; }
    .receipt-store-title { font-size: 18px; font-weight: 800; color: #000; }
    .modal-close-icon { background: #fee2e2; color: #ef4444; border: 2px solid #ef4444; width: 32px; height: 32px; border-radius: 50%; font-size: 16px; font-weight: 900; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    
    .item-card-row { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .item-card-name { font-weight: 700; font-size: 14px; color: #111; }
    .item-card-sub { font-size: 12px; color: #555; }
    .item-card-actions { display: flex; align-items: center; gap: 6px; }
    .btn-pop-qty { width: 30px; height: 30px; border-radius: 6px; font-weight: 900; font-size: 16px; border: 1px solid #ccc; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    
    .pay-actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
    .btn-pay-cash { background: #087f5b; color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 800; cursor: pointer; text-align: center; }
    .btn-pay-online { background: #2563eb; color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 800; cursor: pointer; text-align: center; }
    .btn-clear-cart { grid-column: span 2; background: #fee2e2; color: #dc2626; border: 1px solid #f87171; padding: 8px; border-radius: 8px; font-weight: 700; cursor: pointer; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 4px; color: #333; }
    .form-input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
    .form-btn-submit { background: #087f5b; color: #fff; width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 8px; }
    .manage-item-row { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; padding: 8px 0; font-size: 13px; }
  </style>
</head>
<body>

  <!-- টপ বার -->
  <div class="top-nav">
    <div class="store-brand">মহা পেটুক বিল কাউন্টার</div>
    <div class="nav-actions">
      <button class="top-btn btn-history" onclick="openHistoryModal()"><i class="fa-solid fa-clock-rotate-left"></i> হিস্ট্রি</button>
      <button class="top-btn btn-custom" onclick="openCustomModal()"><i class="fa-solid fa-gear"></i> কাস্টম</button>
    </div>
  </div>

  <div class="top-banner-container">
    <img src="banner.png" alt="মহা পেটুক ব্যানার" class="top-banner-img" onerror="this.style.display='none'">
  </div>
  
  <header class="hero">
    <h1 class="hero-title">মহা পেটুক</h1>
    <div class="hero-sub">আমতা সাহাপাড়া বাজার</div>
    
    <div class="today-summary-bar">
      <i class="fa-solid fa-coins"></i> <span id="summaryText">আজকের মোট বিক্রি: হিসাব হচ্ছে...</span>
    </div>
  </header>

  <!-- সার্চ ও ক্যাটাগরি -->
  <div class="controls-wrap">
    <div class="search-box-wrap">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" class="search-input" id="menuSearchInput" oninput="filterMenu()" placeholder="খাবারের নাম লিখে খুঁজুন...">
    </div>
    <div class="category-pills-bar" id="categoryPillsContainer"></div>
  </div>

  <!-- খাবারের তালিকা -->
  <main class="container">
    <div class="food-grid" id="menuGrid"></div>
  </main>

  <!-- কার্ট বার -->
  <div class="cart-float-bar" id="cartFloatBar">
    <div class="cart-float-info">
      <span class="cart-float-count" id="cartFloatCount">০ টি আইটেম</span>
      <span class="cart-float-total" id="cartFloatTotal">মোট: ₹০</span>
    </div>
    <button class="cart-float-btn" onclick="openReceiptModal()"><i class="fa-solid fa-receipt"></i> মেমো ও বিল করুন</button>
  </div>

  <!-- মেমো মোডাল -->
  <div class="modal-overlay" id="receiptModal">
    <div class="receipt-box">
      <div class="receipt-top-bar">
        <span class="receipt-store-title">মহা পেটুক - মেমো</span>
        <button class="modal-close-icon" onclick="closeModal('receiptModal')">✕</button>
      </div>

      <div id="receiptItemsContainer" style="border-bottom: 2px dashed #444; padding-bottom: 8px; margin-bottom: 12px;"></div>

      <div style="font-size: 18px; font-weight: bold; display: flex; justify-content: space-between; margin-bottom: 14px;">
        <span>সর্বমোট বিল:</span>
        <span id="receiptGrandTotal" style="color:#ef4444;">₹০</span>
      </div>

      <div class="pay-actions-grid">
        <button class="btn-pay-cash" onclick="completeSale('cash')"><i class="fa-solid fa-money-bill-wave"></i> 💵 ক্যাশ বিল</button>
        <button class="btn-pay-online" onclick="completeSale('online')"><i class="fa-solid fa-mobile-screen"></i> 📱 অনলাইন বিল</button>
        <button class="btn-clear-cart" onclick="clearCart()"><i class="fa-solid fa-trash"></i> কার্ট খালি করুন</button>
      </div>
    </div>
  </div>

  <!-- কাস্টম মেনু মোডাল -->
  <div class="modal-overlay" id="customModal">
    <div class="receipt-box" style="max-width:480px;">
      <div class="receipt-top-bar">
        <span class="receipt-store-title" id="customFormTitle">খাবার যোগ / এডিট করুন</span>
        <button class="modal-close-icon" onclick="closeModal('customModal')">✕</button>
      </div>

      <input type="hidden" id="editFoodId">

      <div class="form-group">
        <label>খাবারের নাম *</label>
        <input type="text" id="customName" class="form-input" placeholder="যেমন: চিকেন রোল">
      </div>

      <div class="form-group">
        <label>ক্যাটাগরি</label>
        <input type="text" id="customCategory" class="form-input" placeholder="যেমন: Roll, Chow, Snacks">
      </div>

      <div style="display:flex; gap:10px;">
        <div class="form-group" style="flex:1;">
          <label>হাফ দাম (₹)</label>
          <input type="number" id="customHalfPrice" class="form-input" placeholder="0">
        </div>
        <div class="form-group" style="flex:1;">
          <label>ফুল দাম (₹) *</label>
          <input type="number" id="customFullPrice" class="form-input" placeholder="0">
        </div>
      </div>

      <div class="form-group">
        <label>খাবারের ছবি (গ্যালারি থেকে বেছে নিন)</label>
        <input type="file" id="customImageFile" class="form-input" accept="image/*" onchange="handleImageUpload(event)">
        <input type="hidden" id="customImageBase64">
      </div>

      <button class="form-btn-submit" onclick="saveCustomFood()"><i class="fa-solid fa-floppy-disk"></i> মেনুতে সেভ করুন</button>

      <h3 style="margin: 20px 0 10px; font-size: 15px; border-bottom: 2px solid #ddd; padding-bottom: 4px;">বর্তমান খাবার তালিকা</h3>
      <div id="customFoodList" style="max-height: 220px; overflow-y: auto;"></div>
    </div>
  </div>

  <!-- হিস্ট্রি মোডাল -->
  <div class="modal-overlay" id="historyModal">
    <div class="receipt-box" style="max-width:500px;">
      <div class="receipt-top-bar">
        <span class="receipt-store-title">বিক্রির হিস্ট্রি ও খাতা</span>
        <button class="modal-close-icon" onclick="closeModal('historyModal')">✕</button>
      </div>

      <div style="display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap: wrap;">
        <input type="date" id="historyDateFilter" class="form-input" style="padding:6px; flex:1;" onchange="renderHistory()">
        <button class="top-btn" onclick="clearHistoryDateFilter()">আজ</button>
        <button class="top-btn" style="background:#087f5b;" onclick="backupDatabase()"><i class="fa-solid fa-download"></i> ব্যাকআপ</button>
        <button class="top-btn" style="background:#4b5563;" onclick="document.getElementById('restoreFileInput').click()"><i class="fa-solid fa-upload"></i> রিস্টোর</button>
        <input type="file" id="restoreFileInput" style="display:none;" accept="application/json" onchange="restoreDatabase(event)">
      </div>

      <div id="historyDayStat" style="background:#f3f4f6; padding:10px; border-radius:8px; margin-bottom:12px; font-size:13px; font-weight:700;"></div>

      <div id="historyListContainer" style="max-height: 350px; overflow-y: auto;"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "mahaPetuk_OfflinePOS_v2";

    const defaultData = {
      menu: [
        { id: 1, name: "চিকেন চাউমিন", category: "Chow", halfPrice: 60, fullPrice: 100, image: "chickenchaomin.png" },
        { id: 2, name: "এগ চিকেন রোল", category: "Roll", halfPrice: 0, fullPrice: 60, image: "eggchickenroll.png" },
        { id: 3, name: "চিকেন পকোড়া", category: "Snacks", halfPrice: 50, fullPrice: 90, image: "chickenpokora.png" },
        { id: 4, name: "চিকেন ললিপপ", category: "Snacks", halfPrice: 70, fullPrice: 130, image: "chickenlolipop.png" }
      ],
      sales: []
    };

    let appData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultData;
    let cart = [];
    let selectedSizes = {}; 
    let activeCategory = 'ALL';

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    }

    function money(num) {
      return "₹" + Number(num || 0).toFixed(0);
    }

    function init() {
      renderCategoryPills();
      renderMenu();
      updateTodaySummary();
    }

    function renderCategoryPills() {
      const container = document.getElementById("categoryPillsContainer");
      const categories = ['ALL', ...new Set(appData.menu.map(item => item.category || 'General'))];
      
      container.innerHTML = categories.map(cat => `
        <button class="cat-pill ${cat === activeCategory ? 'active' : ''}" onclick="setCategory('${cat}')">
          ${cat === 'ALL' ? 'সব খাবার' : cat}
        </button>
      `).join("");
    }

    function setCategory(cat) {
      activeCategory = cat;
      renderCategoryPills();
      renderMenu();
    }

    function filterMenu() {
      renderMenu();
    }

    function renderMenu() {
      const grid = document.getElementById("menuGrid");
      const search = (document.getElementById("menuSearchInput").value || "").toLowerCase().trim();

      const filtered = appData.menu.filter(food => {
        const matchesCat = activeCategory === 'ALL' || food.category === activeCategory;
        const matchesSearch = food.name.toLowerCase().includes(search);
        return matchesCat && matchesSearch;
      });

      if (!filtered.length) {
        grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:30px; color:#a1a1aa;">কোনো খাবার পাওয়া যায়নি।</div>';
        return;
      }

      grid.innerHTML = filtered.map(food => {
        const currentSize = selectedSizes[food.id] || (food.halfPrice > 0 ? 'half' : 'full');
        const price = currentSize === 'half' ? food.halfPrice : food.fullPrice;

        return `
          <div class="food-card">
            <div class="food-img-wrap">
              <img src="${food.image || 'banner.png'}" class="food-img" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22><rect fill=%22%23222%22 width=%22100%22 height=%22100%22/><text fill=%22%23666%22 x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 dy=%22.3em%22 font-size=%2224%22>🍽️</text></svg>'">
            </div>
            <div class="food-info">
              <div class="name-bn">${food.name}</div>
              <div class="food-price-row">
                <span class="food-price">${money(price)}</span>
                <span style="font-size:12px; color:#aaa;">${food.category || ''}</span>
              </div>

              ${food.halfPrice > 0 ? `
                <div class="size-select-row">
                  <button class="size-btn ${currentSize === 'half' ? 'active' : ''}" onclick="selectFoodSize(${food.id}, 'half')">হাফ (${money(food.halfPrice)})</button>
                  <button class="size-btn ${currentSize === 'full' ? 'active' : ''}" onclick="selectFoodSize(${food.id}, 'full')">ফুল (${money(food.fullPrice)})</button>
                </div>
              ` : ''}

              <div class="food-bottom">
                <button class="btn-add-item" onclick="addToCart(${food.id})">
                  <i class="fa-solid fa-plus"></i> অর্ডারে যোগ করুন
                </button>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function selectFoodSize(foodId, size) {
      selectedSizes[foodId] = size;
      renderMenu();
    }

    function addToCart(foodId) {
      const food = appData.menu.find(f => f.id === foodId);
      if (!food) return;

      const size = selectedSizes[food.id] || (food.halfPrice > 0 ? 'half' : 'full');
      const price = size === 'half' ? food.halfPrice : food.fullPrice;

      const existing = cart.find(item => item.foodId === foodId && item.size === size);
      if (existing) {
        existing.qty++;
      } else {
        cart.push({
          foodId: food.id,
          name: food.name,
          size: size,
          price: price,
          qty: 1
        });
      }
      updateCartDisplay();
    }

    function updateCartDisplay() {
      const bar = document.getElementById("cartFloatBar");
      const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
      const grandTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      if (totalCount > 0) {
        bar.style.display = "flex";
        document.getElementById("cartFloatCount").textContent = `${totalCount} টি আইটেম যোগ হয়েছে`;
        document.getElementById("cartFloatTotal").textContent = `মোট: ${money(grandTotal)}`;
      } else {
        bar.style.display = "none";
      }
    }

    function openReceiptModal() {
      renderReceiptItems();
      document.getElementById("receiptModal").style.display = "flex";
    }

    function renderReceiptItems() {
      const container = document.getElementById("receiptItemsContainer");
      const grandTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      if (!cart.length) {
        container.innerHTML = '<div style="text-align:center; padding:15px; color:#777;">কার্ট খালি আছে</div>';
        document.getElementById("receiptGrandTotal").textContent = money(0);
        return;
      }

      container.innerHTML = cart.map((item, idx) => `
        <div class="item-card-row">
          <div>
            <div class="item-card-name">${item.name}</div>
            <div class="item-card-sub">${item.size === 'half' ? 'হাফ' : 'ফুল'} • ${money(item.price)} × ${item.qty} = ${money(item.price * item.qty)}</div>
          </div>
          <div class="item-card-actions">
            <button class="btn-pop-qty" onclick="changeCartQty(${idx}, -1)">−</button>
            <span style="font-weight:bold; min-width:24px; text-align:center;">${item.qty}</span>
            <button class="btn-pop-qty" onclick="changeCartQty(${idx}, 1)">+</button>
          </div>
        </div>
      `).join("");

      document.getElementById("receiptGrandTotal").textContent = money(grandTotal);
    }

    function changeCartQty(index, diff) {
      cart[index].qty += diff;
      if (cart[index].qty <= 0) {
        cart.splice(index, 1);
      }
      renderReceiptItems();
      updateCartDisplay();
    }

    function clearCart() {
      cart = [];
      renderReceiptItems();
      updateCartDisplay();
      closeModal('receiptModal');
    }

    function completeSale(method) {
      if (!cart.length) {
        alert("কার্ট খালি!");
        return;
      }

      const grandTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      const billNumber = "MP-" + String(appData.sales.length + 1).padStart(5, '0');

      const saleRecord = {
        id: Date.now(),
        billNumber: billNumber,
        items: [...cart],
        total: grandTotal,
        paymentMethod: method,
        date: new Date().toISOString()
      };

      appData.sales.unshift(saleRecord);
      saveData();

      alert(`✅ বিল সংরক্ষিত হয়েছে!\nবিল নং: ${billNumber}\nমোট: ${money(grandTotal)}\nমাধ্যম: ${method === 'cash' ? 'ক্যাশ' : 'অনলাইন'}`);

      clearCart();
      updateTodaySummary();
    }

    function updateTodaySummary() {
      const todayStr = new Date().toISOString().slice(0, 10);
      const todaySales = appData.sales.filter(s => s.date.slice(0, 10) === todayStr);
      const totalAmount = todaySales.reduce((sum, s) => sum + s.total, 0);

      document.getElementById("summaryText").textContent = `আজকের বিক্রি: ${todaySales.length} টি বিল • মোট: ${money(totalAmount)}`;
    }

    function openCustomModal() {
      resetCustomForm();
      renderCustomFoodList();
      document.getElementById("customModal").style.display = "flex";
    }

    function handleImageUpload(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(event) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const MAX_WIDTH = 800; // চওড়া বাড়িয়ে ৮০০ পিক্সেল করা হলো যাতে ডিটেইল নষ্ট না হয়
      let width = img.width;
      let height = img.height;

      if (width > MAX_WIDTH) {
        height = Math.round((height * MAX_WIDTH) / width);
        width = MAX_WIDTH;
      }

      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);

      // কোয়ালিটি ০.৮৫ রাখা হয়েছে, এতে ছবির সাইজ প্রায় ১২০-১৫০ KB এবং স্পষ্ট থাকবে
      const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
      document.getElementById("customImageBase64").value = compressedDataUrl;
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
}

    

    function saveCustomFood() {
      const name = document.getElementById("customName").value.trim();
      const category = document.getElementById("customCategory").value.trim() || 'General';
      const halfPrice = Number(document.getElementById("customHalfPrice").value) || 0;
      const fullPrice = Number(document.getElementById("customFullPrice").value) || 0;
      const imageBase64 = document.getElementById("customImageBase64").value;
      const editId = Number(document.getElementById("editFoodId").value);

      if (!name) {
        alert("খাবারের নাম লিখুন");
        return;
      }
      if (fullPrice <= 0 && halfPrice <= 0) {
        alert("কমপক্ষে একটি দাম লিখুন");
        return;
      }

      if (editId) {
        const item = appData.menu.find(m => m.id === editId);
        if (item) {
          item.name = name;
          item.category = category;
          item.halfPrice = halfPrice;
          item.fullPrice = fullPrice;
          if (imageBase64) item.image = imageBase64;
        }
      } else {
        appData.menu.push({
          id: Date.now(),
          name,
          category,
          halfPrice,
          fullPrice,
          image: imageBase64 || ''
        });
      }

      saveData();
      resetCustomForm();
      renderCategoryPills();
      renderMenu();
      renderCustomFoodList();
      alert("মেনু সফলভাবে আপডেট হয়েছে!");
    }

    function renderCustomFoodList() {
      const container = document.getElementById("customFoodList");
      container.innerHTML = appData.menu.map(item => `
        <div class="manage-item-row">
          <div>
            <b>${item.name}</b> (${item.category})<br>
            <span style="color:#666;">হাফ: ${money(item.halfPrice)} | ফুল: ${money(item.fullPrice)}</span>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="top-btn" style="padding:4px 8px; font-size:11px;" onclick="editFoodItem(${item.id})">Edit</button>
            <button class="top-btn" style="padding:4px 8px; font-size:11px; background:#dc2626;" onclick="deleteFoodItem(${item.id})">Del</button>
          </div>
        </div>
      `).join("");
    }

    function editFoodItem(id) {
      const item = appData.menu.find(m => m.id === id);
      if (!item) return;

      document.getElementById("editFoodId").value = item.id;
      document.getElementById("customName").value = item.name;
      document.getElementById("customCategory").value = item.category || '';
      document.getElementById("customHalfPrice").value = item.halfPrice || '';
      document.getElementById("customFullPrice").value = item.fullPrice || '';
      document.getElementById("customFormTitle").textContent = "খাবার পরিবর্তন করুন";
    }

    function deleteFoodItem(id) {
      if (!confirm("এই খাবারটি মুছে ফেলবেন?")) return;
      appData.menu = appData.menu.filter(m => m.id !== id);
      saveData();
      renderCategoryPills();
      renderMenu();
      renderCustomFoodList();
    }

    function resetCustomForm() {
      document.getElementById("editFoodId").value = "";
      document.getElementById("customName").value = "";
      document.getElementById("customCategory").value = "";
      document.getElementById("customHalfPrice").value = "";
      document.getElementById("customFullPrice").value = "";
      document.getElementById("customImageBase64").value = "";
      document.getElementById("customImageFile").value = "";
      document.getElementById("customFormTitle").textContent = "খাবার যোগ / এডিট করুন";
    }

    function openHistoryModal() {
      document.getElementById("historyDateFilter").value = new Date().toISOString().slice(0, 10);
      renderHistory();
      document.getElementById("historyModal").style.display = "flex";
    }

    function clearHistoryDateFilter() {
      document.getElementById("historyDateFilter").value = "";
      renderHistory();
    }

    function renderHistory() {
      const filterDate = document.getElementById("historyDateFilter").value;
      const container = document.getElementById("historyListContainer");
      const statContainer = document.getElementById("historyDayStat");

      const filtered = appData.sales.filter(s => !filterDate || s.date.slice(0, 10) === filterDate);
      const totalAmount = filtered.reduce((sum, s) => sum + s.total, 0);
      const cashAmount = filtered.filter(s => s.paymentMethod === 'cash').reduce((sum, s) => sum + s.total, 0);
      const onlineAmount = filtered.filter(s => s.paymentMethod === 'online').reduce((sum, s) => sum + s.total, 0);

      statContainer.innerHTML = `
        তারিখ: ${filterDate || 'সব দিন'}<br>
        মোট বিল: ${filtered.length} টি | সর্বমোট: ${money(totalAmount)}<br>
        💵 ক্যাশ: ${money(cashAmount)} | 📱 অনলাইন: ${money(onlineAmount)}
      `;

      if (!filtered.length) {
        container.innerHTML = '<div style="text-align:center; padding:20px; color:#888;">কোনো বিক্রির রেকর্ড নেই</div>';
        return;
      }

      container.innerHTML = filtered.map(s => `
        <div style="border-bottom:1px solid #ddd; padding:8px 0; font-size:13px;">
          <div style="display:flex; justify-content:space-between; font-weight:bold;">
            <span>${s.billNumber} • ${new Date(s.date).toLocaleTimeString('bn-IN')}</span>
            <span style="color:#ef4444;">${money(s.total)} (${s.paymentMethod === 'cash' ? 'ক্যাশ' : 'অনলাইন'})</span>
          </div>
          <div style="color:#555; font-size:12px; margin-top:2px;">
            ${s.items.map(i => `${i.name}(${i.size === 'half' ? 'হাফ' : 'ফুল'}) × ${i.qty}`).join(', ')}
          </div>
          <button style="color:#dc2626; background:none; border:none; font-size:11px; cursor:pointer; margin-top:4px;" onclick="deleteSaleRecord(${s.id})"><i class="fa-solid fa-trash"></i> মুছুন</button>
        </div>
      `).join("");
    }

    function deleteSaleRecord(id) {
      if (!confirm("এই বিল রেকর্ডটি মুছবেন?")) return;
      appData.sales = appData.sales.filter(s => s.id !== id);
      saveData();
      renderHistory();
      updateTodaySummary();
    }

    function backupDatabase() {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `maha-petuk-backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    function restoreDatabase(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const parsed = JSON.parse(event.target.result);
          if (!parsed.menu || !parsed.sales) throw new Error("Invalid");
          appData = parsed;
          saveData();
          init();
          renderHistory();
          alert("ডাটা সফলভাবে রিস্টোর হয়েছে!");
        } catch (err) {
          alert("ভুল ব্যাকআপ ফাইল!");
        }
      };
      reader.readAsText(file);
    }

    function closeModal(id) {
      document.getElementById(id).style.display = "none";
    }

    init();
  </script>
</body>
</html>
